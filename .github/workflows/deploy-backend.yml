name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [ deploy_azure ]
    # 🔥 Chỉ kích hoạt pipeline khi có thay đổi trong thư mục backend hoặc chính file workflow này
    paths:
      - 'backend/**' 
      - '.github/workflows/deploy-backend.yml'
  # Cho phép kích hoạt chạy pipeline bằng tay từ giao diện GitHub
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4

      # Thiết lập Docker Buildx để tối ưu hóa caching khi build Docker image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Đăng nhập vào Azure bằng Service Principal
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2. Đăng nhập vào Azure Container Registry (ACR)
      - name: Log in to ACR
        run: |
          az acr login --name acrgoodsmanagementtest

      # 3. Build & Push Docker Image sử dụng setup-buildx cache
      - name: Build and push image to ACR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: acrgoodsmanagementtest.azurecr.io/goods-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Cập nhật Image mới lên cả 3 Container Apps (API, Worker, Beat)
      - name: Deploy to Container Apps (API, Worker, Beat)
        run: |
          echo "Updating API Container App..."
          az containerapp update \
            --name ca-goods-api \
            --resource-group rg-goods-management-test \
            --image acrgoodsmanagementtest.azurecr.io/goods-backend:${{ github.sha }}
          
          echo "Updating Worker Container App..."
          az containerapp update \
            --name ca-goods-worker \
            --resource-group rg-goods-management-test \
            --image acrgoodsmanagementtest.azurecr.io/goods-backend:${{ github.sha }}
          
          echo "Updating Beat Container App..."
          az containerapp update \
            --name ca-goods-beat \
            --resource-group rg-goods-management-test \
            --image acrgoodsmanagementtest.azurecr.io/goods-backend:${{ github.sha }}