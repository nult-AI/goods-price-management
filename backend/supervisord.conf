[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/app/logs/supervisord.pid

[program:redis]
command=redis-server --port 6379
autostart=true
autorestart=true
priority=1

[program:fastapi]
command=uv run uvicorn app.main:app --host 0.0.0.0 --port 7860
autostart=true
autorestart=true
priority=2

[program:celery_worker]
command=uv run celery -A app.tasks.worker worker --loglevel=info --pool=solo
autostart=true
autorestart=true
priority=3

[program:celery_beat]
command=uv run celery -A app.tasks.worker beat --loglevel=info
autostart=true
autorestart=true
priority=4
