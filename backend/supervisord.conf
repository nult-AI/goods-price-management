[supervisord]
nodaemon=true
#user=1000
# Lưu log và pid vào /tmp vì đây là nơi duy nhất chắc chắn có quyền ghi trên HF
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --port 6379 --protected-mode no --daemonize no
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fastapi]
# Đảm bảo app.main:app đúng đường dẫn trong folder backend của bạn
command=uv run uvicorn app.main:app --host 0.0.0.0 --port 7860
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery_worker]
# Thêm pidfile vào /tmp để tránh lỗi ghi quyền thư mục
command=uv run celery -A app.tasks.worker worker --loglevel=info --pool=solo --pidfile=/tmp/worker.pid
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery_beat]
command=uv run celery -A app.tasks.worker beat --loglevel=info --pidfile=/tmp/beat.pid
autostart=true
autorestart=true
priority=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0