# Chọn model bạn muốn dùng (vd: sonnet, 4o, gemini/gemini-2.5-pro)
openai-api-base: https://generativelanguage.googleapis.com/v1beta/openai/
openai-api-key: AIzaSy... # Dán đúng API Key từ Google AI Studio vào đây
model: openai/gemini-3.8-flash
weak-model: openai/gemma-4-31b-it

show-model-warnings: false

# Tự động tạo git commit sau mỗi lần hoàn thành sửa đổi
auto-commits: true

# Luôn luôn đọc file này vào bộ nhớ ngữ cảnh (chế độ Read-only)
read:
  - PROJECT_GUIDE.md

# Tự động thêm file .aider* vào .gitignore để không đẩy file cấu hình rác lên repo
gitignore: true